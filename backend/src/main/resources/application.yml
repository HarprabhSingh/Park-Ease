spring:
  application:
    name: parkeasy-backend
  datasource:
    url: ${PARKEASY_DB_URL:jdbc:postgresql://localhost:5434/parkeasy}
    username: ${PARKEASY_DB_USERNAME:parkeasy}
    password: ${PARKEASY_DB_PASSWORD:parkeasy_local}
  flyway:
    locations: classpath:db/migration
    validate-migration-naming: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
